name: Install backyard transformation

on:
  push:
    branches:
      - agent/backyard-transformation-project
    paths:
      - .github/workflows/install-backyard-transformation.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/backyard-transformation-project
          fetch-depth: 0

      - name: Download verified payload
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1jfb7KgBbhll1VF9SzAOCN9e_Ep6E6PW3&export=download&confirm=t" \
            -o /tmp/ebc-backyard-transformation.zip
          echo "b9e9f32a257cc233694877e1ff8dcc17bcd6fbcc1cddfc301faa4637d22db97e  /tmp/ebc-backyard-transformation.zip" | sha256sum -c -

      - name: Validate and extract payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path('/tmp/ebc-backyard-transformation.zip')
          destination = Path('/tmp/ebc-backyard-transformation')
          allowed = {
              'assets/backyard-transformation.css',
              'assets/portfolio.js',
              'assets/images/portfolio/transformations/backyard/wall-finished.svg',
              'assets/images/portfolio/transformations/backyard/driveway-finished.svg',
              'assets/images/portfolio/transformations/backyard/slab-finished.svg',
              'assets/images/portfolio/transformations/backyard/yard-before-tools.svg',
              'assets/images/portfolio/transformations/backyard/yard-before-shed.svg',
              'assets/images/portfolio/transformations/backyard/yard-before-fence.svg',
              'tests/backyard-transformation-check.mjs',
              'package.json',
          }

          with zipfile.ZipFile(archive) as package:
              files = set()
              for member in package.infolist():
                  path = PurePosixPath(member.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.filename}')
                  if member.is_dir():
                      continue
                  if member.external_attr >> 16 & 0o170000 == 0o120000:
                      raise SystemExit(f'Symlink not allowed: {member.filename}')
                  files.add(member.filename)
              if files != allowed:
                  raise SystemExit(f'Unexpected payload files: {sorted(files ^ allowed)}')
              package.extractall(destination)
          PY
          cp -R /tmp/ebc-backyard-transformation/. .
          rm -f .github/workflows/install-backyard-transformation.yml

      - name: Verify website
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          git diff --check

      - name: Commit installed project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete backyard transformation project"
          git push origin HEAD:agent/backyard-transformation-project
