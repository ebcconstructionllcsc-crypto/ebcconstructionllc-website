name: Verify live EBC portfolio release

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-public-release.yml

permissions:
  contents: write
  pages: read

jobs:
  verify-live-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_ROOT: https://api.github.com/repos/ebcconstructionllcsc-crypto/ebcconstructionllc-website
      SITE_ROOT: https://ebcconstructionllc.com
      RAW_ROOT: https://raw.githubusercontent.com/ebcconstructionllcsc-crypto/ebcconstructionllc-website/main
      EXPECTED_MAIN_SHA: 1d226064a2fc80d365faab807a1f03c37cffd4a5
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-audit-improvements
          fetch-depth: 0

      - name: Verify HTML, JavaScript and public media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p .release-verification

          curl -fsSL \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "${SITE_ROOT}/projects.html?release=${cache_key}" \
            -o .release-verification/public-projects.html

          curl -fsSL "${RAW_ROOT}/projects.html?release=${cache_key}" \
            -o .release-verification/raw-projects.html

          public_html_sha="$(sha256sum .release-verification/public-projects.html | awk '{print $1}')"
          raw_html_sha="$(sha256sum .release-verification/raw-projects.html | awk '{print $1}')"
          test "$public_html_sha" = "$raw_html_sha"

          grep -q 'Visualize your project before work begins' .release-verification/public-projects.html
          grep -q 'assets/portfolio-audit.css' .release-verification/public-projects.html
          grep -q 'assets/portfolio.js' .release-verification/public-projects.html
          grep -q 'data-phase="preparation"' .release-verification/public-projects.html
          grep -q 'data-phase="finish"' .release-verification/public-projects.html
          ! grep -q 'drive.google.com/thumbnail' .release-verification/public-projects.html

          curl -fsSL \
            -H 'Cache-Control: no-cache' \
            "${SITE_ROOT}/assets/portfolio.js?release=${cache_key}" \
            -o .release-verification/portfolio.js
          grep -q 'project-stories' .release-verification/portfolio.js
          grep -q 'data-project-story="true"' .release-verification/portfolio.js
          grep -q 'data-audio="on"' .release-verification/portfolio.js

          cat > .release-verification/video-paths.txt <<'VIDEOS'
          assets/video/portfolio/preparation-base.mp4
          assets/video/portfolio/excavation-roots.mp4
          assets/video/portfolio/finish-power-trowel.mp4
          assets/video/portfolio/finish-large-slab.mp4
          assets/video/portfolio/finish-cleanup.mp4
          assets/video/portfolio/stories/ebc-project-story-horizontal-with-audio.mp4
          assets/video/portfolio/stories/ebc-project-story-vertical-with-audio.mp4
          VIDEOS

          : > .release-verification/videos.jsonl
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            output="$(curl -fsSL -o /dev/null \
              -w '%{http_code}|%{size_download}|%{content_type}' \
              -H 'Cache-Control: no-cache' \
              "${SITE_ROOT}/${path}?release=${cache_key}")"
            code="${output%%|*}"
            remainder="${output#*|}"
            size="${remainder%%|*}"
            content_type="${remainder#*|}"
            test "$code" = "200"
            awk -v bytes="$size" 'BEGIN { exit !(bytes > 0) }'
            jq -cn \
              --arg path "$path" \
              --arg contentType "$content_type" \
              --argjson bytes "${size%.*}" \
              '{path:$path,httpStatus:200,bytes:$bytes,contentType:$contentType}' \
              >> .release-verification/videos.jsonl
          done < .release-verification/video-paths.txt

          pages="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_ROOT}/pages")"
          build="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_ROOT}/pages/builds/latest")"
          build_status="$(jq -r '.status' <<<"$build")"
          build_commit="$(jq -r '.commit' <<<"$build")"
          test "$build_status" = "built"
          test "$build_commit" = "$EXPECTED_MAIN_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from datetime import datetime, timezone

          root = Path('.release-verification')
          videos = [json.loads(line) for line in (root / 'videos.jsonl').read_text().splitlines() if line.strip()]
          public = (root / 'public-projects.html').read_bytes()
          controller = (root / 'portfolio.js').read_bytes()
          result = {
              'status': 'live',
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'url': 'https://ebcconstructionllc.com/projects.html',
              'expectedMainSha': '1d226064a2fc80d365faab807a1f03c37cffd4a5',
              'pagesStatus': 'built',
              'html': {
                  'matchesMain': True,
                  'sha256': hashlib.sha256(public).hexdigest(),
                  'bytes': len(public),
                  'usesLocalMedia': True,
              },
              'portfolioController': {
                  'loaded': True,
                  'sha256': hashlib.sha256(controller).hexdigest(),
                  'bytes': len(controller),
                  'editedStoriesWithAudio': 2,
              },
              'videos': videos,
              'videoCount': len(videos),
          }
          Path('deployment-status.json').write_text(json.dumps(result, indent=2) + '\n')
          PY

          test "$(jq -r '.videoCount' deployment-status.json)" = "7"
          cat deployment-status.json

      - name: Record live-release evidence
        run: |
          set -euo pipefail
          rm -rf .release-verification deployment-diagnostics.json
          git config user.name "EBC Release Verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A deployment-status.json deployment-diagnostics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record verified live portfolio release"
          git push origin HEAD:agent/portfolio-audit-improvements
