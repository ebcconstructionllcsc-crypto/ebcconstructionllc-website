name: Diagnose EBC Pages origin

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-public-release.yml

permissions:
  contents: write
  pages: read

jobs:
  diagnose-pages-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_ROOT: https://api.github.com/repos/ebcconstructionllcsc-crypto/ebcconstructionllc-website
      PUBLIC_URL: https://ebcconstructionllc.com/projects.html
      DEFAULT_URL: https://ebcconstructionllcsc-crypto.github.io/ebcconstructionllc-website/projects.html
      RAW_URL: https://raw.githubusercontent.com/ebcconstructionllcsc-crypto/ebcconstructionllc-website/main/projects.html
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-audit-improvements
          fetch-depth: 0

      - name: Compare repository, Pages origin and custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .release-diagnostics

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_ROOT}/pages" > .release-diagnostics/pages-site.json

          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_ROOT}/pages/builds/latest" > .release-diagnostics/latest-build.json

          curl -fsSL -D .release-diagnostics/public-headers.txt \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "${PUBLIC_URL}?diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o .release-diagnostics/public.html

          curl -sS -D .release-diagnostics/default-headers.txt \
            -o .release-diagnostics/default.html \
            "${DEFAULT_URL}?diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true

          curl -fsSL "${RAW_URL}?diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o .release-diagnostics/raw-main.html

          : > .release-diagnostics/origins.jsonl
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            body=".release-diagnostics/origin-${ip}.html"
            headers=".release-diagnostics/origin-${ip}-headers.txt"
            if curl -fsSL --resolve "ebcconstructionllc.com:443:${ip}" \
              -D "$headers" \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${PUBLIC_URL}?diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ip}" \
              -o "$body"; then
              marker="old"
              grep -q 'project-stories' "$body" && marker="new"
              jq -n \
                --arg ip "$ip" \
                --arg marker "$marker" \
                --arg sha "$(sha256sum "$body" | awk '{print $1}')" \
                '{ip:$ip, marker:$marker, sha256:$sha}' >> .release-diagnostics/origins.jsonl
            else
              jq -n --arg ip "$ip" '{ip:$ip, marker:"unreachable", sha256:null}' >> .release-diagnostics/origins.jsonl
            fi
          done

          getent ahostsv4 ebcconstructionllc.com | awk '{print $1}' | sort -u > .release-diagnostics/resolved-ipv4.txt || true

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from datetime import datetime, timezone

          root = Path('.release-diagnostics')

          def read(name):
              path = root / name
              return path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''

          def load(name):
              text = read(name)
              return json.loads(text) if text else {}

          def file_info(name):
              path = root / name
              if not path.exists():
                  return {'marker': 'missing', 'sha256': None, 'bytes': 0}
              data = path.read_bytes()
              text = data.decode('utf-8', errors='replace')
              marker = 'new' if 'project-stories' in text and 'assets/portfolio.js' in text else 'old'
              return {
                  'marker': marker,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
              }

          origins = []
          for line in read('origins.jsonl').splitlines():
              if line.strip():
                  origins.append(json.loads(line))

          pages = load('pages-site.json')
          build = load('latest-build.json')
          result = {
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'pages': {
                  'status': pages.get('status'),
                  'cname': pages.get('cname'),
                  'htmlUrl': pages.get('html_url'),
                  'buildType': pages.get('build_type'),
                  'source': pages.get('source'),
                  'httpsEnforced': pages.get('https_enforced'),
              },
              'latestBuild': {
                  'status': build.get('status'),
                  'commit': build.get('commit'),
                  'createdAt': build.get('created_at'),
                  'updatedAt': build.get('updated_at'),
                  'error': (build.get('error') or {}).get('message'),
              },
              'publicDomain': file_info('public.html'),
              'defaultGithubIo': file_info('default.html'),
              'rawMain': file_info('raw-main.html'),
              'directGithubPagesOrigins': origins,
              'resolvedIpv4': read('resolved-ipv4.txt').splitlines(),
              'publicHeaders': read('public-headers.txt'),
              'defaultHeaders': read('default-headers.txt'),
          }
          Path('deployment-diagnostics.json').write_text(
              json.dumps(result, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          cat deployment-diagnostics.json

      - name: Record diagnostics
        run: |
          set -euo pipefail
          rm -rf .release-diagnostics
          git config user.name "EBC Release Verification"
          git config user.email "actions@users.noreply.github.com"
          git add deployment-diagnostics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Pages origin diagnostics"
          git push origin HEAD:agent/portfolio-audit-improvements
