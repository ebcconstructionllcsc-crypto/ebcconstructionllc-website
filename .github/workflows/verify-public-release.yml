name: Publish and verify EBC Pages release

on:
  push:
    branches:
      - agent/portfolio-audit-improvements
    paths:
      - .github/workflows/verify-public-release.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-public-release.yml

permissions:
  contents: write
  pages: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_ROOT: https://api.github.com/repos/ebcconstructionllcsc-crypto/ebcconstructionllc-website
      PUBLIC_URL: https://ebcconstructionllc.com/projects.html
      EXPECTED_MAIN_SHA: 1d226064a2fc80d365faab807a1f03c37cffd4a5
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: agent/portfolio-audit-improvements
          fetch-depth: 0

      - name: Request a GitHub Pages build
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          http_code="$(curl -sS -L \
            -o pages-build-request.json \
            -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_ROOT}/pages/builds")"
          echo "http_code=${http_code}" >> "$GITHUB_OUTPUT"
          test "$http_code" = "201" || test "$http_code" = "202"

      - name: Wait for Pages and the public domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_status="queued"
          public_status="stale"
          attempts=0
          latest_build='{}'
          pages_site='{}'

          for i in $(seq 1 30); do
            attempts="$i"
            pages_site="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API_ROOT}/pages" || echo '{}')"
            latest_build="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API_ROOT}/pages/builds/latest" || echo '{}')"
            pages_status="$(jq -r '.status // "unknown"' <<<"$latest_build")"

            body="$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${PUBLIC_URL}?release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}" || true)"

            if grep -q 'project-stories' <<<"$body" \
              && grep -q 'assets/portfolio.js' <<<"$body" \
              && ! grep -q 'drive.google.com/thumbnail' <<<"$body"; then
              public_status="live"
            fi

            if [ "$pages_status" = "built" ] && [ "$public_status" = "live" ]; then
              break
            fi

            if [ "$pages_status" = "errored" ]; then
              break
            fi

            sleep 15
          done

          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg status "$public_status" \
            --arg generatedAt "$generated_at" \
            --arg expectedMainSha "$EXPECTED_MAIN_SHA" \
            --arg url "$PUBLIC_URL" \
            --arg pagesStatus "$pages_status" \
            --argjson attempts "$attempts" \
            --argjson pagesSite "$pages_site" \
            --argjson latestBuild "$latest_build" \
            --slurpfile buildRequest pages-build-request.json \
            '{
              status: $status,
              generatedAt: $generatedAt,
              attempts: $attempts,
              expectedMainSha: $expectedMainSha,
              url: $url,
              pagesStatus: $pagesStatus,
              pagesSite: {
                status: ($pagesSite.status // null),
                cname: ($pagesSite.cname // null),
                htmlUrl: ($pagesSite.html_url // null),
                buildType: ($pagesSite.build_type // null),
                source: ($pagesSite.source // null),
                httpsEnforced: ($pagesSite.https_enforced // null)
              },
              latestBuild: {
                status: ($latestBuild.status // null),
                commit: ($latestBuild.commit // null),
                createdAt: ($latestBuild.created_at // null),
                updatedAt: ($latestBuild.updated_at // null),
                error: ($latestBuild.error.message // null)
              },
              buildRequest: ($buildRequest[0] // null)
            }' > deployment-status.json

          test "$pages_status" = "built"
          test "$public_status" = "live"

      - name: Record publication evidence
        if: always()
        run: |
          set -euo pipefail
          test -s deployment-status.json || printf '%s\n' '{"status":"workflow-error"}' > deployment-status.json
          rm -f pages-build-request.json
          git config user.name "EBC Release Verification"
          git config user.email "actions@users.noreply.github.com"
          git add deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record GitHub Pages publication evidence"
          git push origin HEAD:agent/portfolio-audit-improvements
