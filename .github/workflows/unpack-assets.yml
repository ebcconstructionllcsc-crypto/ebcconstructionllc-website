name: Install website media

on:
  push:
    paths:
      - 'EBC-GitHub-Assets.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack optimized media
        run: |
          unzip -o EBC-GitHub-Assets.zip
          rm EBC-GitHub-Assets.zip
      - name: Commit media files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git rm --cached EBC-GitHub-Assets.zip || true
          git commit -m "Install optimized EBC website media" || exit 0
          git push
