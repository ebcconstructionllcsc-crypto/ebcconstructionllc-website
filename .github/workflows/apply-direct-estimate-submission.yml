name: Apply direct estimate submission

on:
  push:
    branches:
      - feature/direct-estimate-submission
    paths:
      - .github/workflows/apply-direct-estimate-submission.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/direct-estimate-submission
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire direct submission
        run: node scripts/apply-direct-estimate-submission.mjs

      - name: Run full verification
        run: npm test

      - name: Remove one-time files
        run: |
          rm scripts/apply-direct-estimate-submission.mjs
          rm .github/workflows/apply-direct-estimate-submission.yml

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html package.json scripts/apply-direct-estimate-submission.mjs .github/workflows/apply-direct-estimate-submission.yml
          git commit -m "Connect public estimates directly to EBC Manager"
          git push origin HEAD:feature/direct-estimate-submission
