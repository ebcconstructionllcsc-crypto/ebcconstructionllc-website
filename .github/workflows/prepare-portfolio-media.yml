name: Install audited EBC portfolio

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ebc-portfolio-install-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  install-and-verify:
    if: github.head_ref == 'agent/portfolio-audit-improvements'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download the immutable audited package
        env:
          PACKAGE_FILE_ID: 1gEfyzEu6Rq1jmiszHSmyzCVLqDtNoPDx
          PACKAGE_SHA256: 3373a7adadb40986c627a31b3767a26bdd96415ce69495a617f0c8f662f9d5e1
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'gdown==5.2.0'
          python3 -m gdown --quiet --fuzzy \
            "https://drive.google.com/file/d/${PACKAGE_FILE_ID}/view" \
            -O /tmp/ebc-portfolio-audit-payload.zip
          echo "${PACKAGE_SHA256}  /tmp/ebc-portfolio-audit-payload.zip" | sha256sum --check --strict

      - name: Validate and install the package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = '/tmp/ebc-portfolio-audit-payload.zip'
          required = {
              'projects.html',
              'package.json',
              'assets/portfolio-audit.css',
              'assets/portfolio.js',
              'tests/portfolio-audit-check.mjs',
              'assets/media/portfolio-manifest.json',
          }
          with ZipFile(archive) as bundle:
              entries = bundle.infolist()
              names = {entry.filename for entry in entries}
              if len(entries) > 100:
                  raise SystemExit('Portfolio package contains too many entries.')
              if sum(entry.file_size for entry in entries) > 50 * 1024 * 1024:
                  raise SystemExit('Portfolio package is unexpectedly large.')
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing required package files: {missing}')
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {entry.filename}')
                  if ((entry.external_attr >> 16) & 0o170000) == 0o120000:
                      raise SystemExit(f'Symlink entries are not allowed: {entry.filename}')
              bundle.extractall('.')
          PY
          test -s projects.html
          test -s assets/portfolio-audit.css
          test -s assets/portfolio.js
          test -s assets/media/portfolio-manifest.json

      - name: Verify silent H.264 portfolio video
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          while IFS= read -r video; do
            test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
            test "$(stat -c %s "$video")" -lt 26214400
          done < <(find assets/video/portfolio -type f -name '*.mp4' -print | sort)

      - name: Run the complete site test and production build
        run: |
          set -euo pipefail
          npm ci
          npm test
          npx vite build
          git diff --check

      - name: Commit the verified portfolio
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-portfolio-media.yml
          git config user.name 'EBC Portfolio Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No portfolio changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild portfolio with audited local media'
          git push origin "HEAD:${HEAD_BRANCH}"
