name: Review gallery package without deployment

on:
  push:
    branches: [feat/gallery-reviewed-20261002]
    paths: [.github/workflows/gallery-stage-review.yml]

permissions:
  contents: read

jobs:
  verify-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download owner-provided public gallery package
        run: |
          curl --fail --location --max-time 90 'https://drive.usercontent.google.com/download?id=1-B_cwE1VTZE4ae1hk_GPHi7P0X7xWDio&export=download&confirm=t' -o /tmp/gallery.zip
          echo 'a868c92e0eb058c6dc919039b5f6889df942865821d7a12ce730144f5be7aa83  /tmp/gallery.zip' | sha256sum --check --strict
      - name: Verify exact scope and integrate into review workspace only
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,stat,zipfile
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/gallery.zip') as z:
              manifest=json.loads(z.read('_gallery-stage.json'))
              files=manifest['files']
              allowed={'index.html','projects.html','assets/gallery-refresh.css','assets/gallery-refresh.js','assets/media/gallery-20261002.json'}
              assert len(files)==85
              assert set(z.namelist())==set(files)|{'_gallery-stage.json'}
              assert all(p in allowed or p.startswith('assets/images/gallery-20261002/') for p in files)
              for path,expected in manifest['expected_originals'].items():
                  assert path in {'index.html','projects.html'}
                  assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected, 'Base page changed; reconcile before applying'
              for path,expected in files.items():
                  target=(root/path).resolve()
                  assert target.is_relative_to(root)
                  member=z.getinfo(path)
                  assert not stat.S_ISLNK(member.external_attr>>16)
                  assert member.file_size<2000000
                  data=z.read(path)
                  assert hashlib.sha256(data).hexdigest()==expected
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('Verified 85 review files; production untouched.')
          PY
      - name: Install test dependencies
        run: npm ci
      - name: Run full existing verification and gallery syntax check
        run: |
          npm test
          node --check assets/gallery-refresh.js
      - name: Package reviewed public website without private review metadata
        run: |
          mkdir -p /tmp/gallery-reviewed
          git ls-files -z | tar --null -T - -cf /tmp/gallery-reviewed/baseline-repository.tar
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/gallery-reviewed/website-gallery-ready.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in ['index.html','projects.html','services.html','about.html','reviews.html','contact.html','robots.txt','sitemap.xml','CNAME','.nojekyll']:
                  z.write(root/name,name)
              for folder in ['assets','app']:
                  for path in (root/folder).rglob('*'):
                      if path.is_file(): z.write(path,path.relative_to(root))
          pathlib.Path('/tmp/gallery-reviewed/STATUS.txt').write_text('REVIEW ONLY. No deployment executed. Merge or production publication requires separate approval.\n')
          PY
      - name: Save verified review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebc-gallery-reviewed-no-deploy
          path: /tmp/gallery-reviewed/
          retention-days: 7
