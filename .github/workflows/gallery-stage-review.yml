name: Stage verified EBC gallery without deployment

on:
  push:
    branches: [feat/gallery-reviewed-20261002]
    paths: [.github/workflows/gallery-stage-review.yml]

permissions:
  contents: write

jobs:
  stage-gallery:
    if: github.ref == 'refs/heads/feat/gallery-reviewed-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download exact verified public gallery payload
        run: |
          curl --fail --location --max-time 90 'https://drive.usercontent.google.com/download?id=1-B_cwE1VTZE4ae1hk_GPHi7P0X7xWDio&export=download&confirm=t' -o /tmp/gallery.zip
          echo 'a868c92e0eb058c6dc919039b5f6889df942865821d7a12ce730144f5be7aa83  /tmp/gallery.zip' | sha256sum --check --strict
      - name: Apply only verified gallery paths
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,stat,subprocess,zipfile
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/gallery.zip') as z:
              manifest=json.loads(z.read('_gallery-stage.json'))
              files=manifest['files']
              allowed={'index.html','projects.html','assets/gallery-refresh.css','assets/gallery-refresh.js','assets/media/gallery-20261002.json'}
              assert len(files)==85
              assert set(z.namelist())==set(files)|{'_gallery-stage.json'}
              assert all(p in allowed or p.startswith('assets/images/gallery-20261002/') for p in files)
              for p,expected in manifest['expected_originals'].items():
                  assert p in {'index.html','projects.html'}
                  assert hashlib.sha256((root/p).read_bytes()).hexdigest()==expected,'Base changed: stop and reconcile'
              for p,expected in files.items():
                  target=(root/p).resolve()
                  assert target.is_relative_to(root)
                  member=z.getinfo(p)
                  assert not stat.S_ISLNK(member.external_attr>>16)
                  assert member.file_size<2000000
                  data=z.read(p)
                  assert hashlib.sha256(data).hexdigest()==expected
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
              subprocess.run(['git','add','--',*sorted(files)],check=True)
              staged=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
              assert {p for p in staged if p}==set(files)
          print('85 gallery paths validated; no contact, app, database, domain or production changes.')
          PY
      - name: Test the integrated site
        run: |
          npm ci
          npm test
          node --check assets/gallery-refresh.js
      - name: Commit only to the isolated review branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/gallery-reviewed-20261002'
          REMOTE_HEAD=$(git ls-remote origin refs/heads/feat/gallery-reviewed-20261002 | cut -f1)
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate 13 reviewed EBC photos and responsive gallery; no production deployment'
          git push origin HEAD:refs/heads/feat/gallery-reviewed-20261002
          git rev-parse HEAD
